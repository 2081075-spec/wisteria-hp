<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ページが見つかりません｜株式会社Wisteria</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400&family=Noto+Sans+JP:wght@300&family=Cormorant+Garamond:wght@400&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBFAF8;color:#00191A;font-family:"Noto Sans JP",system-ui,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
.nf{min-height:100dvh;display:grid;place-items:center;text-align:center;padding:40px 24px}
.code{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(72px,14vw,160px);line-height:1;letter-spacing:.1em;color:#006466;margin:0 0 24px}
h1{font-family:'Shippori Mincho',serif;font-weight:400;font-size:clamp(20px,3vw,30px);letter-spacing:.08em;margin:0 0 18px}
p{font-size:14px;line-height:2.2;letter-spacing:.04em;color:rgba(0,25,26,.55);margin:0 0 36px}
a.btn{display:inline-block;font-size:14px;letter-spacing:.1em;border:1px solid #00191A;padding:18px 42px;color:inherit;text-decoration:none;transition:background .2s,color .2s}
a.btn:hover{background:#00191A;color:#FBFAF8}
</style>
</head>
<body>
<div class="nf">
  <div>
    <p class="code">404</p>
    <h1>お探しのページは見つかりませんでした。</h1>
    <p>URLが変更されたか、ページが移動した可能性があります。<br>トップページからお探しください。</p>
    <p lang="en">The page you are looking for could not be found. It may have been moved.</p>
    <a class="btn" id="home" href="/">トップページへ / Home</a>
  </div>
</div>
<script>(function(){var m=location.pathname.match(/^\/wisteria-hp\//);if(m){document.getElementById('home').href='/wisteria-hp/';}})();</script>
</body>
</html>
